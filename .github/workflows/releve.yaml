name: Relevé occupation IRVE

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:  # permet de lancer manuellement depuis l'onglet Actions, pratique pour tester

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le relevé
        run: python releve_occupation.py

      - name: Commit et push si changement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add historique_occupation.csv
          git diff --staged --quiet || git commit -m "Relevé automatique $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push